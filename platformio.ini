; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
lib_dir = ./src/
src_dir = ./
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
board_build.f_cpu = 160000000L
board_build.ldscript = eagle.flash.4m1m.ld
upload_speed = 921600
monitor_speed = 921600
; lwIP with 1460 byte TCP segments: the 170 kB web ui loads ~2x faster (needs a bit more heap during transfers)
build_flags = -DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
lib_deps =  
    ; maintained successors of me-no-dev/ESPAsyncTCP + ESP Async WebServer
    ; (the me-no-dev packages are gone from the registry)
    esp32async/ESPAsyncTCP@2.0.0
    esp32async/ESPAsyncWebServer@3.12.1
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.4.0
    bluemurder/ESP8266-ping@^2.0.1
    ;r-downing/PersWiFiManager@^3.0.1
    ;links2004/WebSockets@^2.1.4
build_src_filter =
  +<**/*.c>
  +<**/*.cpp>
  +<**/*.ino>
  -<./3rdparty/*>

; No-WiFi build (ENABLE_WIFI=0). The WebSockets sources have no ENABLE_WIFI guard
; and include ESPAsyncTCP.h, which this env does not pull in, so they are filtered out.
[env:d1_mini_nowifi]
extends = env:d1_mini
build_flags = ${env:d1_mini.build_flags} -DENABLE_WIFI=0
lib_deps =
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.4.0
build_src_filter =
  ${env:d1_mini.build_src_filter}
  -<src/WebSockets.cpp>
  -<src/WebSocketsServer.cpp>

; diagnostic build: prints loop timing every 3 s on the serial port (no behaviour change)
[env:d1_mini_diag]
extends = env:d1_mini
build_flags = ${env:d1_mini.build_flags} -DLOOP_DIAG


; ESP32 D1 mini (Wemos/Lolin "D1 mini ESP32"): see platform_esp32.h and board_d1_mini32.h
[env:d1_mini32]
platform = espressif32@^6.9.0
board = wemos_d1_mini32
framework = arduino
board_build.filesystem = littlefs
; ~1.9 MB per app slot (OTA stays possible), 128 kB file system for presets / slots
board_build.partitions = min_spiffs.csv
; WebSockets library: use the base64 encoder of the ESP32 core
; own host name / access point name, so an ESP8266 and an ESP32 device can run in the same network
build_flags = -DCORE_HAS_LIBB64 -DDEVICE_HOSTNAME=\"gbscontrol32\"
upload_speed = 921600
monitor_speed = 921600
lib_deps =
    esp32async/AsyncTCP@^3.4.0
    esp32async/ESPAsyncWebServer@3.12.1
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.4.0
build_src_filter = ${env:d1_mini.build_src_filter}

; ESP32 diagnostic build (see d1_mini_diag)
[env:d1_mini32_diag]
extends = env:d1_mini32
build_flags = ${env:d1_mini32.build_flags} -DLOOP_DIAG
